# Settings for ASH (Automated Security Helper): https://github.com/awslabs/automated-security-helper
# Run from this folder: ash --source-dir . --mode local
# Checkov checks that don't apply are skipped in the template metadata (lib/scanner-suppressions.ts).
project_name: per-tenant-observability-for-cloudfront
global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: cdk.out/**
      reason: Generated by cdk synth, not part of the source.
  suppressions:
    - rule_id: SECRET-HEX-HIGH-ENTROPY-STRING
      # detect-secrets can report paths relative to another directory, so match with a ** prefix.
      path: '**/test/per-tenant-observability-stack.test.ts'
      reason: Example CloudFront distribution ID (E1234567890ABC) in a unit test, not a secret.
